# All media lives under DATA_DIR (set in .env):
#   DATA_DIR/movies      -> Plex "Films"
#   DATA_DIR/shows       -> Plex "Séries TV"
#   DATA_DIR/incomplete  -> Transmission work in progress
# Moving everything to a USB disk = copy the folder, change DATA_DIR, `make up`.
# Paths inside the containers never change, so Plex and Transmission need no reconfiguration.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - VERSION=docker
    volumes:
      - ./config/plex:/config
      - ${DATA_DIR:-./downloads}/movies:/movies
      - ${DATA_DIR:-./downloads}/shows:/shows
    # Transcoding scratch space in RAM instead of the SD card.
    # In Plex: Settings > Transcoder > Transcoder temporary directory = /transcode
    tmpfs:
      - /transcode:size=1g
    logging: *logging
    restart: unless-stopped

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - USER=${TRANSMISSION_USER:?set TRANSMISSION_USER in .env}
      - PASS=${TRANSMISSION_PASS:?set TRANSMISSION_PASS in .env}
      - HOST_WHITELIST=*
    volumes:
      - ./config/transmission:/config
      # One mount for everything: moves between incomplete/ and movies/ are instant renames, not copies.
      - ${DATA_DIR:-./downloads}:/downloads
      - ./watch:/watch
    logging: *logging
    restart: unless-stopped
